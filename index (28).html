<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather App - Tugas Rutin 5</title>
<style>
:root{--bg1:#4b4285;--bg2:#1a1440;--card:#2f2681;--card2:#241c66;--accent:#e6c9f7;--text:#f2efff;--muted:#a9a3d6;--err:#ff6b8b}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));display:flex;justify-content:center;padding:24px 16px}
button,input{font:inherit;color:inherit}
svg{display:block}
.app{width:100%;max-width:460px;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:1.1rem;font-weight:500;letter-spacing:.5px}
.units{display:flex;background:var(--card2);border-radius:999px;padding:3px}
.units button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted);transition:.2s}
.units button.active{background:var(--accent);color:#2b1d63;font-weight:600}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--card2);border:1px solid transparent;border-radius:14px;padding:12px 16px;outline:none;transition:.2s}
.search input:focus{border-color:var(--accent)}
.search input::placeholder{color:var(--muted)}
.search button{display:flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:0 18px;background:var(--accent);color:#2b1d63;font-weight:600;cursor:pointer}
.search button:disabled{opacity:.6;cursor:wait}
.history{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.history:empty{display:none}
.chip{border:0;cursor:pointer;background:var(--card);padding:6px 12px;border-radius:999px;font-size:.85rem;color:var(--text)}
.chip:hover{background:var(--accent);color:#2b1d63}
.chip.clear{background:transparent;color:var(--muted);text-decoration:underline}
.error{display:none;align-items:center;gap:10px;background:rgba(255,107,139,.12);border:1px solid var(--err);color:#ffc2d0;border-radius:14px;padding:12px 16px;font-size:.92rem}
.error.show{display:flex}
.error svg{flex:none;width:20px;height:20px}
.loading{display:none;justify-content:center;padding:60px 0}
.loading.show{display:flex}
.spinner{width:44px;height:44px;border:4px solid var(--card);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:50px 10px;line-height:1.6}
.empty svg{width:72px;height:72px;margin:0 auto 12px;opacity:.9}
.hidden{display:none!important}
.main{background:linear-gradient(180deg,#2a2170,#1d1654);border-radius:26px;padding:26px 20px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.main .big-icon svg{width:110px;height:110px;margin:0 auto}
.main h2{font-size:1.5rem;font-weight:500;margin-top:6px}
.main .desc{text-transform:capitalize;letter-spacing:1px;font-size:1.15rem;margin-top:4px}
.main .date{color:var(--muted);font-size:.9rem;margin-top:4px}
.main .temp{font-size:4.6rem;font-weight:300;line-height:1.1;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat{background:var(--card);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:1.05rem;font-weight:600}
.stat span{font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
h3{font-size:1.05rem;font-weight:500;margin-bottom:10px}
.hours{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.hour{flex:none;width:78px;text-align:center;background:var(--card);border-radius:14px;padding:10px 4px;font-size:.82rem}
.hour:first-child{background:var(--accent);color:#2b1d63}
.hour svg{width:38px;height:38px;margin:6px auto}
.hour b{display:block;font-size:1rem}
.days{display:flex;flex-direction:column;background:var(--card2);border-radius:20px;padding:6px 16px}
.day{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.day:last-child{border:0}
.day .name{flex:1}
.day .name small{display:block;color:var(--muted);text-transform:capitalize}
.day svg{width:40px;height:40px}
.day .range{min-width:78px;text-align:right}
.day .range span{color:var(--muted)}
@media(max-width:380px){.main .temp{font-size:3.8rem}.hour{width:70px}}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Weather App</h1>
    <div class="units" role="group" aria-label="Satuan suhu">
      <button type="button" data-unit="C" class="active">&deg;C</button>
      <button type="button" data-unit="F">&deg;F</button>
    </div>
  </header>

  <form class="search" id="form" autocomplete="off">
    <input id="city" type="text" placeholder="Cari kota, contoh: Medan" aria-label="Nama kota">
    <button type="submit" id="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      Cari
    </button>
  </form>

  <div class="history" id="history"></div>

  <div class="error" id="error" role="alert" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>
    <span id="errorText"></span>
  </div>

  <div class="loading" id="loading" aria-label="Memuat"><div class="spinner"></div></div>

  <div class="empty" id="empty">
    <svg viewBox="0 0 64 64" fill="none" stroke="#e6c9f7" stroke-width="3" stroke-linecap="round"><path d="M20 44h26a10 10 0 0 0 1-19.9A14 14 0 0 0 20 26a9 9 0 0 0 0 18z"/></svg>
    Cari nama kota untuk melihat cuaca saat ini dan prakiraan 5 hari.
  </div>

  <section id="result" class="hidden">
    <div class="main">
      <div class="big-icon" id="bigIcon"></div>
      <h2 id="cityName"></h2>
      <div class="desc" id="desc"></div>
      <div class="date" id="date"></div>
      <div class="temp" id="temp"></div>
      <div class="stats">
        <div class="stat"><b id="humidity"></b><span>Kelembaban</span></div>
        <div class="stat"><b id="wind"></b><span>Angin</span></div>
        <div class="stat"><b id="feels"></b><span>Terasa</span></div>
      </div>
    </div>
    <h3 style="margin-top:22px">Hari ini</h3>
    <div class="hours" id="hours"></div>
    <h3 style="margin-top:22px">5 hari ke depan</h3>
    <div class="days" id="days"></div>
  </section>
</main>

<script>
"use strict";

// ====== KONFIGURASI ======
// Ganti dengan API key OpenWeatherMap kamu (https://openweathermap.org/api)
const API_KEY = "04ef312d879e8f9871d6582325e1c112";
const BASE_URL = "https://api.openweathermap.org/data/2.5";
const HISTORY_KEY = "weather_history";
const UNIT_KEY = "weather_unit";
const MAX_HISTORY = 5;

// ====== STATE & ELEMEN ======
const $ = (id) => document.getElementById(id);
const state = { unit: "C", current: null, forecast: null };

// ====== LOCALSTORAGE (aman dari error) ======
const store = {
  get: (key, fallback) => {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch { return fallback; }
  },
  set: (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* abaikan */ }
  }
};

// ====== IKON SVG ======
const cloudPath = (y = 0, fill = "#e8ecf8") =>
  `<path transform="translate(0 ${y})" d="M20 40h26a9 9 0 0 0 1-17.9A13 13 0 0 0 21 24a8 8 0 0 0-1 16z" fill="${fill}"/>`;

const sunShape = (cx, cy, r, rayLen) => {
  const rays = Array.from({ length: 8 }, (_, i) => {
    const a = (i * Math.PI) / 4;
    const x1 = cx + Math.cos(a) * (r + 4), y1 = cy + Math.sin(a) * (r + 4);
    const x2 = cx + Math.cos(a) * (r + 4 + rayLen), y2 = cy + Math.sin(a) * (r + 4 + rayLen);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }).join("");
  return `<g stroke="#ffc93c" stroke-width="3" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffc93c"/>`;
};

const moonShape = `<path d="M40 12a19 19 0 1 0 13 32A17 17 0 0 1 40 12z" fill="#f5e6a8"/>`;
const drops = `<g stroke="#5ab4ff" stroke-width="3" stroke-linecap="round"><line x1="24" y1="48" x2="21" y2="56"/><line x1="34" y1="48" x2="31" y2="56"/><line x1="44" y1="48" x2="41" y2="56"/></g>`;
const flakes = `<g fill="#fff"><circle cx="24" cy="52" r="2.5"/><circle cx="34" cy="55" r="2.5"/><circle cx="44" cy="52" r="2.5"/></g>`;
const bolt = `<polygon points="35,42 26,54 32,54 30,63 41,48 35,48" fill="#ffc93c"/>`;
const mist = `<g stroke="#c9cfe8" stroke-width="3.5" stroke-linecap="round"><line x1="14" y1="24" x2="50" y2="24"/><line x1="10" y1="34" x2="46" y2="34"/><line x1="16" y1="44" x2="54" y2="44"/></g>`;

const getIcon = (code = "01d") => {
  const night = code.endsWith("n");
  const type = code.slice(0, 2);
  const shapes = {
    "01": night ? moonShape : sunShape(32, 32, 12, 6),
    "02": (night ? `<g transform="translate(-6 -2) scale(.7)">${moonShape}</g>` : sunShape(24, 22, 8, 4)) + cloudPath(6),
    "03": cloudPath(0),
    "04": cloudPath(-4, "#b8bfd9") + cloudPath(4),
    "09": cloudPath(-4, "#b8bfd9") + drops,
    "10": cloudPath(-4, "#b8bfd9") + drops,
    "11": cloudPath(-6, "#9aa2c4") + bolt,
    "13": cloudPath(-4) + flakes,
    "50": mist
  };
  return `<svg viewBox="0 0 64 64" aria-hidden="true">${shapes[type] ?? cloudPath(0)}</svg>`;
};

// ====== HELPER ======
const escapeHTML = (str) =>
  String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const toUnit = (c) => Math.round(state.unit === "C" ? c : (c * 9) / 5 + 32);
const fmtTemp = (c) => `${toUnit(c)}\u00B0`;
const localDate = (dt, tz) => new Date((dt + tz) * 1000); // baca pakai getUTC*/timeZone UTC

const showError = (msg) => {
  $("errorText").textContent = msg;
  $("error").classList.add("show");
};
const clearError = () => $("error").classList.remove("show");

const setLoading = (on) => {
  $("loading").classList.toggle("show", on);
  $("btn").disabled = on;
  if (on) {
    $("empty").classList.add("hidden");
    $("result").classList.add("hidden");
  }
};

// ====== RIWAYAT ======
const getHistory = () => store.get(HISTORY_KEY, []);

const saveHistory = (city) => {
  const list = [city, ...getHistory().filter((c) => c.toLowerCase() !== city.toLowerCase())].slice(0, MAX_HISTORY);
  store.set(HISTORY_KEY, list);
  renderHistory();
};

const renderHistory = () => {
  const list = getHistory();
  $("history").innerHTML = list.length
    ? list.map((c) => `<button type="button" class="chip" data-city="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join("") +
      `<button type="button" class="chip clear" data-clear="1">Hapus riwayat</button>`
    : "";
};

// ====== FETCH ======
const request = async (endpoint, city) => {
  const url = `${BASE_URL}/${endpoint}?q=${encodeURIComponent(city)}&units=metric&lang=id&appid=${API_KEY}`;
  const res = await fetch(url);
  if (res.status === 404) throw new Error("NOT_FOUND");
  if (res.status === 401) throw new Error("BAD_KEY");
  if (!res.ok) throw new Error("HTTP_" + res.status);
  return res.json();
};

const fetchWeather = async (city) => {
  clearError();
  if (!city.trim()) {
    showError("Masukkan nama kota terlebih dahulu.");
    return;
  }
  if (API_KEY === "ISI_API_KEY_KAMU_DISINI") {
    showError("API key belum diisi. Isi konstanta API_KEY di dalam index.html.");
    return;
  }
  setLoading(true);
  try {
    const [current, forecast] = await Promise.all([request("weather", city.trim()), request("forecast", city.trim())]);
    state.current = current;
    state.forecast = forecast;
    saveHistory(current.name);
    $("city").value = "";
    render();
  } catch (err) {
    $("empty").classList.toggle("hidden", Boolean(state.current));
    $("result").classList.toggle("hidden", !state.current);
    if (err.message === "NOT_FOUND") showError(`Kota "${city.trim()}" tidak ditemukan. Periksa penulisan nama kota.`);
    else if (err.message === "BAD_KEY") showError("API key tidak valid atau belum aktif. Key baru biasanya aktif setelah beberapa menit.");
    else if (err instanceof TypeError) showError("Gagal terhubung ke server. Periksa koneksi internet kamu.");
    else showError("Terjadi kesalahan saat mengambil data. Coba lagi nanti.");
  } finally {
    setLoading(false);
  }
};

// ====== RENDER ======
const groupByDay = (list, tz) =>
  list.reduce((acc, item) => {
    const key = localDate(item.dt, tz).toISOString().slice(0, 10);
    (acc[key] ??= []).push(item);
    return acc;
  }, {});

const render = () => {
  const { current: c, forecast: f } = state;
  if (!c || !f) return;
  const tz = c.timezone;
  const w = c.weather[0];

  $("bigIcon").innerHTML = getIcon(w.icon);
  $("cityName").textContent = `${c.name}, ${c.sys.country}`;
  $("desc").textContent = w.description;
  $("date").textContent = localDate(c.dt, tz).toLocaleDateString("id-ID", {
    weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC"
  });
  $("temp").textContent = fmtTemp(c.main.temp);
  $("humidity").textContent = `${c.main.humidity}%`;
  $("wind").textContent = `${Math.round(c.wind.speed * 3.6)} km/j`;
  $("feels").textContent = fmtTemp(c.main.feels_like);

  // Per jam (6 data pertama, interval 3 jam)
  $("hours").innerHTML = f.list.slice(0, 6).map((h, i) => {
    const hh = String(localDate(h.dt, tz).getUTCHours()).padStart(2, "0");
    return `<div class="hour"><span>${i === 0 ? "Segera" : hh + ":00"}</span>${getIcon(h.weather[0].icon)}<b>${fmtTemp(h.main.temp)}</b></div>`;
  }).join("");

  // 5 hari: dikelompokkan per tanggal dengan reduce, ikon diambil yang paling dekat jam 12
  const days = Object.entries(groupByDay(f.list, tz)).slice(0, 5).map(([key, items]) => {
    const noon = items.reduce((a, b) =>
      Math.abs(localDate(b.dt, tz).getUTCHours() - 12) < Math.abs(localDate(a.dt, tz).getUTCHours() - 12) ? b : a);
    return {
      name: new Date(key + "T00:00:00Z").toLocaleDateString("id-ID", { weekday: "long", timeZone: "UTC" }),
      desc: noon.weather[0].description,
      icon: noon.weather[0].icon,
      min: Math.min(...items.map((i) => i.main.temp_min)),
      max: Math.max(...items.map((i) => i.main.temp_max))
    };
  });

  $("days").innerHTML = days.map((d) => `
    <div class="day">
      <div class="name">${escapeHTML(d.name)}<small>${escapeHTML(d.desc)}</small></div>
      ${getIcon(d.icon)}
      <div class="range">${fmtTemp(d.max)} <span>${fmtTemp(d.min)}</span></div>
    </div>`).join("");

  $("empty").classList.add("hidden");
  $("result").classList.remove("hidden");
};

// ====== EVENT ======
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  fetchWeather($("city").value);
});

$("history").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  if (btn.dataset.clear) {
    store.set(HISTORY_KEY, []);
    renderHistory();
  } else if (btn.dataset.city) {
    fetchWeather(btn.dataset.city);
  }
});

document.querySelector(".units").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-unit]");
  if (!btn) return;
  state.unit = btn.dataset.unit;
  store.set(UNIT_KEY, state.unit);
  document.querySelectorAll(".units button").forEach((b) => b.classList.toggle("active", b === btn));
  render();
});

// ====== INIT ======
const init = () => {
  const savedUnit = store.get(UNIT_KEY, "C");
  state.unit = savedUnit === "F" ? "F" : "C";
  document.querySelectorAll(".units button").forEach((b) => b.classList.toggle("active", b.dataset.unit === state.unit));
  renderHistory();
  const [last] = getHistory();
  if (last) fetchWeather(last);
};
init();
</script>
</body>
</html>
